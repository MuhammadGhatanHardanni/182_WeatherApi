<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencari Lokasi MapTiler</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-animation"></div>

    <div class="container">
        <div class="glass-card">
            <header>
                <h1>📍 Pencari Lokasi</h1>
                <p>Temukan detail koordinat dan wilayah menggunakan MapTiler Geocoding API</p>
            </header>


            <div class="search-box">
                <input type="text" id="locationInput" placeholder="Masukkan nama lokasi (misal: Jakarta)...">
                <button id="searchBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>

            <div class="loading" id="loadingIndicator">
                <div class="spinner"></div>
                <p>Mencari...</p>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <div class="result-box" id="resultBox">
                <div class="data-row">
                    <span class="label">Negara</span>
                    <span class="value" id="resNegara">-</span>
                </div>
                <div class="data-row">
                    <span class="label">Provinsi</span>
                    <span class="value" id="resProvinsi">-</span>
                </div>
                <div class="data-row">
                    <span class="label">Kota/Kecamatan</span>
                    <span class="value" id="resKecamatan">-</span>
                </div>

                <div class="coordinates-grid">
                    <div class="coord-card">
                        <span class="coord-label">Longitude</span>
                        <span class="coord-value" id="resLongitude">-</span>
                    </div>
                    <div class="coord-card">
                        <span class="coord-label">Latitude</span>
                        <span class="coord-value" id="resLatitude">-</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
